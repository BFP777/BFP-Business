
name: BFP Business AI Dev64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/android-dev64.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        id: source
        shell: bash
        run: |
          ZIP_COUNT=$(find source -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "Expected exactly one source ZIP, found $ZIP_COUNT"
            exit 1
          fi
          ZIP=$(find source -maxdepth 1 -name '*.zip')
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         gradle-version: '8.9'

      - name: Build New APK
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload New APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-AI-Dev64-APK
          path: ${{ steps.source.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
