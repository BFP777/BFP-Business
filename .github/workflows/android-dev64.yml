
name: BFP Business AI Dev64 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "source/BFP-Business-Pro-AI-Edition-Dev64-Source(1)(1)-1.zip"
      - ".github/workflows/android-dev64.yml"

jobs:
  build-dev64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Dev64 ZIP
        run: |
          mkdir -p project
          unzip -q "source/BFP-Business-Pro-AI-Edition-Dev64-Source(1)(1)-1.zip" -d project
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Gradle project root not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Dev64 APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload Dev64 APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-AI-Dev64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
