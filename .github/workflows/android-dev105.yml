
name: BFP Business Pro Signed APK DEV107

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-dev105.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV107 imported source
        uses: actions/checkout@v4

      - name: Verify DEV107 project and version
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'versionCode = 552' app/build.gradle.kts
          grep -q 'versionName = "5.52.0"' app/build.gradle.kts
          echo "DEV107 root Android project verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable signing
        env:
          STORE_B64: ${{ secrets.BFP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_B64" || { echo "Missing BFP_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing BFP_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BFP_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BFP_KEY_PASSWORD secret"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/release-key.jks"
          echo "$STORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "BFP_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "BFP_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BFP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BFP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Stable signing keystore and alias verified."

      - name: Build DEV107 signed release APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Verify release APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "Release APK not found"; exit 1; }
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='in.bhajan.bfpbusinesspro' versionCode='552' versionName='5.52.0'"
          echo "DEV107 signed APK signature and version verified."

      - name: Upload DEV107 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-Pro-Signed-DEV107
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
