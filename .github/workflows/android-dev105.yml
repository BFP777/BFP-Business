name: BFP Business Pro Signed APK DEV105

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/BFP-Business-Pro-DEV105-NEW-Kotlin-Fix-Source.zip'
      - '.github/workflows/android-dev105.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV105 source
        uses: actions/checkout@v4

      - name: Verify and extract exact DEV105 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='source/BFP-Business-Pro-DEV105-NEW-Kotlin-Fix-Source.zip'
          test -f "$ZIP" || { echo "Required DEV105 ZIP missing: $ZIP"; exit 1; }
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          test -n "$GRADLE_FILE" || { echo "Gradle settings file not found in DEV105 ZIP"; exit 1; }
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "Expected Android app module not found"; exit 1; }
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using exact source archive: $ZIP"
          echo "Gradle project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable signing
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          STORE_B64: ${{ secrets.BFP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_B64" || { echo "Missing BFP_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing BFP_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BFP_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BFP_KEY_PASSWORD secret"; exit 1; }
          echo "$STORE_B64" | base64 --decode > ../release-key.jks
          test -s ../release-key.jks
          keytool -list -keystore ../release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Stable signing keystore and alias verified."

      - name: Build DEV105 signed release APK
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          BFP_KEYSTORE_FILE: ../release-key.jks
          BFP_KEYSTORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          BFP_KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          BFP_KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' -type f -print -quit)
          test -n "$APK" || { echo "Release APK not found"; exit 1; }
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "DEV105 release APK signature verified."

      - name: Upload DEV105 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-Pro-Signed-DEV105
          path: ${{ steps.source.outputs.dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
