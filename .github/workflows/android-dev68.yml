name: BFP Business Pro Signed APK Dev69

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/android-dev68.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Extract Source ZIP
        id: source
        shell: bash
        run: |
          set -e
          ZIP_COUNT=$(find source -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "Expected exactly one source ZIP, found $ZIP_COUNT"
            exit 1
          fi
          ZIP=$(find source -maxdepth 1 -name '*.zip')
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -type f -name 'settings.gradle*' | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configure Signing
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          STORE_B64: ${{ secrets.BFP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$STORE_B64" | base64 --decode > release-key.jks
          test -s release-key.jks
          keytool -list -keystore release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Stable signing keystore and alias verified."

      - name: Build Signed Release APK
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          BFP_KEYSTORE_FILE: ../release-key.jks
          BFP_KEYSTORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          BFP_KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          BFP_KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        run: |
          set -e
          gradle --no-daemon assembleRelease

      - name: Verify APK Signature
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -e
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK signature verified."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-Pro-Signed-Dev69
          path: ${{ steps.source.outputs.dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
