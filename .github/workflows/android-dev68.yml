
name: BFP Business Pro Signed APK Dev68

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/android-dev68.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Extract Source ZIP
        id: source
        shell: bash
        run: |
          ZIP_COUNT=$(find source -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "Expected exactly one source ZIP, found $ZIP_COUNT"
            exit 1
          fi
          ZIP=$(find source -maxdepth 1 -name '*.zip')
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -type f -name 'settings.gradle*' | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'                   - name: Setup Android SDK      
          uses: android-actions/setup-android@v4       
          with:         
        packages: 'platform-tools'
      - name: Configure Signin. 
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          STORE_B64: ${{ secrets.BFP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BFP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BFP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BFP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          test -n "$STORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$STORE_B64" | base64 --decode > release-key.jks
          test -s release-key.jks
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "signingConfigs" in s:
              raise SystemExit("Signing config already exists; refusing duplicate patch")
          marker = "    buildFeatures { buildConfig = true }"
          addition = '''
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("release-key.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
          '''
          if marker not in s:
              raise SystemExit("Expected Android Gradle configuration not found")
          p.write_text(s.replace(marker, addition + "\n" + marker, 1))
          PY

      - name: Build Signed Release APK
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Verify APK Signature
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify "$APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BFP-Business-Pro-Signed-Dev68
          path: ${{ steps.source.outputs.dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
